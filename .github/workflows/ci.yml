name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Zero-dependency sanity check
        run: python -c "import continuum; print('version', continuum.VERSION)"

      - name: Full test suite (unittest, zero-dependency)
        timeout-minutes: 12   # 挂死护栏：正常 1-2 分钟；超时自动失败并保留 verbose 日志（macOS 挂死排查 2026-10-06）
        run: python -m unittest discover -s tests -v

      - name: Install smoke (pip install + CLI + MCP handshake)
        shell: bash
        run: |
          python -m pip install --quiet ".[mcp]"
          continuum --version
          python - <<'EOF'
          import json, subprocess, sys
          p = subprocess.run(
              [sys.executable, "-m", "continuum.cli", "serve", "--db", ":memory:"],
              input=json.dumps({"jsonrpc": "2.0", "id": 1, "method": "initialize",
                                "params": {"protocolVersion": "2024-11-05",
                                           "capabilities": {},
                                           "clientInfo": {"name": "ci-pkg", "version": "0"}}}) + "\n",
              capture_output=True, text=True, encoding="utf-8", timeout=60)
          resp = json.loads(p.stdout.splitlines()[0])
          assert resp["result"]["serverInfo"]["name"] == "continuum", resp
          print("packaged serve handshake OK")
          EOF

      - name: Privacy check — no network libraries in core
        run: python tests/check_no_network.py
